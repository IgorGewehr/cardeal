[package]
name         = "cardeal-server"
description  = "O Cardeal online: muitas empresas, um SQLite por empresa, HTTP + postcard (ADR-0016)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
name = "cardeal_server"
path = "src/lib.rs"

[[bin]]
name = "cardeal-server"
path = "src/main.rs"

[dependencies]
cardeal-kernel.workspace       = true
cardeal-storage.workspace      = true
cardeal-auth.workspace         = true
cardeal-motor.workspace        = true
cardeal-distribuicao.workspace = true
cardeal-protocol.workspace     = true
mod-empresa.workspace          = true

axum.workspace       = true
tower-http.workspace = true
tokio.workspace      = true
rusqlite.workspace   = true
serde.workspace      = true
postcard.workspace   = true
parking_lot.workspace = true
blake3.workspace     = true
rand.workspace       = true
base64.workspace     = true
clap.workspace       = true
anyhow.workspace     = true
tracing.workspace    = true
tracing-subscriber.workspace = true
mimalloc.workspace   = true
zstd.workspace       = true
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
tempfile.workspace  = true
tower = { workspace = true, features = ["util"] }
mod-clientes.workspace = true
zstd.workspace         = true
rusqlite.workspace     = true
serde.workspace    = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
mimalloc.workspace = true
