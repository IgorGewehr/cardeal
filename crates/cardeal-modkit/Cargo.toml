[package]
name         = "cardeal-modkit"
description  = "Sistema de módulos: manifesto, registro, permissões, menu e despacho de comandos."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true


[features]
# O despacho (comandos/consultas sobre SQLite). Desligado, sobra o lado declarativo —
# manifesto, permissões, ícones, resolução de módulos — que a UI e o cliente WASM usam.
default = ["sqlite"]
sqlite  = [
    "cardeal-ledger/sqlite",
    "dep:cardeal-storage",
    "dep:cardeal-auth",
    "dep:postcard",
    "dep:rusqlite",
]

[dependencies]
cardeal-kernel.workspace = true
cardeal-ledger  = { path = "../cardeal-ledger", default-features = false }
cardeal-storage = { workspace = true, optional = true }
cardeal-auth    = { workspace = true, optional = true }
serde.workspace = true
postcard = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
