[package]
name         = "cardeal-fiscal"
description  = "Cliente da API fiscal externa: emissão, contingência, DFe e SPED."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true


[dependencies]
cardeal-kernel.workspace = true
cardeal-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `native-tls` só para a Sefin Nacional: o IIS dela pede o certificado do cliente por
# renegociação TLS 1.2, que o rustls não implementa (SChannel/OpenSSL implementam). O resto do
# Cardeal segue no rustls.
reqwest = { workspace = true, features = ["blocking", "native-tls"] }
base64.workspace = true
tokio.workspace = true
tracing.workspace = true
quick-xml.workspace = true
aes.workspace = true
cbc.workspace = true
des.workspace = true
rc2.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
sha1 = { workspace = true, features = ["oid"] }
sha2 = { workspace = true, features = ["oid"] }
rand.workspace = true
zeroize.workspace = true
postcard.workspace = true
rsa.workspace = true
flate2.workspace = true

[dev-dependencies]
