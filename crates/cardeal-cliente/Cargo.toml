[package]
name         = "cardeal-cliente"
description  = "Como a interface chega ao motor: local (embutido) ou remoto (cardeal-server)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = ["local"]
# O motor embutido no processo (monoposto) — leva o SQLite junto.
local = ["dep:cardeal-motor", "mod-empresa/sqlite"]

[dependencies]
cardeal-kernel.workspace   = true
cardeal-protocol.workspace = true
cardeal-modkit = { path = "../cardeal-modkit", default-features = false }
mod-empresa    = { path = "../modulos/mod-empresa", default-features = false }
cardeal-motor  = { workspace = true, optional = true }
serde.workspace     = true
postcard.workspace  = true
thiserror.workspace = true
tracing.workspace   = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
cardeal-server.workspace = true
mod-clientes.workspace   = true
mod-empresa.workspace    = true
tempfile.workspace       = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
axum.workspace = true
