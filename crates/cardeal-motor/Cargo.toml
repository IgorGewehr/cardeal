[package]
name         = "cardeal-motor"
description  = "O motor de uma empresa: base, migrações, autenticação e despacho — anfitrião do desktop e do servidor."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
cardeal-kernel.workspace  = true
cardeal-storage.workspace = true
cardeal-modkit.workspace  = true
cardeal-auth.workspace    = true
cardeal-ledger.workspace  = true
rusqlite.workspace = true
serde.workspace    = true
postcard.workspace = true
base64.workspace   = true

[dev-dependencies]
# Provar o contrato "admin recém-criado tem acesso a tudo que está ativo" exige módulos
# concretos — o motor em si nunca depende de um (o Core não conhece módulo concreto).
mod-financeiro.workspace = true
mod-clientes.workspace   = true
mod-estoque.workspace    = true
mod-os.workspace         = true
mod-pdv.workspace        = true
mod-vendas.workspace     = true
tempfile.workspace       = true
