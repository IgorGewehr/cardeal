[package]
name         = "mod-pdv"
description  = "Frente de caixa: venda rápida, sessão de caixa, sangria e modo autônomo."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = ["sqlite"]
# Persistência em SQLite (despacho, repositório, migrações). Desligada, sobra o domínio
# e os tipos de comando/consulta — o que o cliente egui/WASM compila (ADR-0016).
sqlite = ["dep:cardeal-storage", "dep:rusqlite", "cardeal-ledger/sqlite", "cardeal-modkit/sqlite", "cardeal-auth/sqlite", "mod-financeiro/sqlite", "mod-estoque/sqlite", "mod-vendas/sqlite"]
# Telas do módulo (compiladas apenas no desktop).
ui = ["dep:cardeal-ui", "dep:egui"]
# Submódulos — ver docs/04-pilar-modularidade.md §2.1
frente_caixa = []
sangria = []
turno = []
tef = []
balanca = []
pista = []
delivery = []
completo = ["frente_caixa", "sangria", "turno", "tef", "balanca", "pista", "delivery"]

[dependencies]
cardeal-kernel.workspace  = true
cardeal-ledger = { path = "../../cardeal-ledger", default-features = false }
cardeal-storage = { workspace = true, optional = true }
cardeal-modkit = { path = "../../cardeal-modkit", default-features = false }
cardeal-auth = { path = "../../cardeal-auth", default-features = false }
mod-financeiro = { path = "../mod-financeiro", default-features = false }
mod-estoque = { path = "../mod-estoque", default-features = false }
mod-vendas = { path = "../mod-vendas", default-features = false }
cardeal-ui = { workspace = true, optional = true }
egui       = { workspace = true, optional = true }
serde.workspace     = true
thiserror.workspace = true
smallvec.workspace  = true
rusqlite = { workspace = true, optional = true }
tracing.workspace   = true

[dev-dependencies]
cardeal-testkit.workspace = true
proptest.workspace        = true
mod-clientes.workspace    = true
postcard.workspace        = true
tempfile.workspace        = true
