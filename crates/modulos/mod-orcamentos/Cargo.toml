[package]
name         = "mod-orcamentos"
description  = "Orçamentos comerciais: documento profissional, filtros, decisão e PDF."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = ["sqlite"]
# Persistência em SQLite (despacho, repositório, migrações). Desligada, sobra o domínio
# e os tipos de comando/consulta — o que o cliente egui/WASM compila (ADR-0016).
sqlite = ["dep:cardeal-storage", "dep:rusqlite", "cardeal-modkit/sqlite", "mod-os/sqlite"]

[dependencies]
cardeal-kernel.workspace  = true
cardeal-storage = { workspace = true, optional = true }
cardeal-modkit = { path = "../../cardeal-modkit", default-features = false }
mod-os = { path = "../mod-os", default-features = false }
serde.workspace     = true
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }
tracing.workspace   = true

[dev-dependencies]
cardeal-auth.workspace    = true
cardeal-ledger.workspace  = true
cardeal-testkit.workspace = true
mod-clientes.workspace    = true
mod-financeiro.workspace  = true
mod-estoque.workspace     = true
postcard.workspace        = true
tempfile.workspace        = true
