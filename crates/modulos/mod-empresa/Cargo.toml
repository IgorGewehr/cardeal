[package]
name         = "mod-empresa"
description  = "A própria empresa: dados cadastrais, identidade visual, usuários e papéis — pelo despacho."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = ["sqlite"]
# Persistência em SQLite (despacho, SQL). Desligada, sobram os tipos — o que o cliente
# egui/WASM compila (ADR-0016).
sqlite = [
    "dep:cardeal-storage",
    "dep:rusqlite",
    "dep:base64",
    "cardeal-modkit/sqlite",
    "cardeal-auth/sqlite",
]

[dependencies]
cardeal-kernel.workspace = true
cardeal-modkit  = { path = "../../cardeal-modkit", default-features = false }
cardeal-auth    = { path = "../../cardeal-auth", default-features = false }
cardeal-storage = { workspace = true, optional = true }
rusqlite        = { workspace = true, optional = true }
base64          = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
postcard.workspace     = true
tempfile.workspace     = true
