[package]
name         = "mod-os"
description  = "Ordem de serviço: laudo, orçamento, execução e garantia."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = ["sqlite"]
# Persistência em SQLite (despacho, repositório, migrações). Desligada, sobra o domínio
# e os tipos de comando/consulta — o que o cliente egui/WASM compila (ADR-0016).
sqlite = ["dep:cardeal-storage", "dep:rusqlite", "cardeal-ledger/sqlite", "cardeal-modkit/sqlite", "mod-financeiro/sqlite", "mod-estoque/sqlite", "mod-clientes/sqlite"]
# Telas do módulo (compiladas apenas no desktop).
ui = ["dep:cardeal-ui", "dep:egui"]
# Submódulos — ver docs/04-pilar-modularidade.md §2.1
laudo = []
garantia = []
checklist = []
completo = ["laudo", "garantia", "checklist"]

[dependencies]
cardeal-kernel.workspace  = true
cardeal-ledger = { path = "../../cardeal-ledger", default-features = false }
cardeal-storage = { workspace = true, optional = true }
cardeal-modkit = { path = "../../cardeal-modkit", default-features = false }
mod-financeiro = { path = "../mod-financeiro", default-features = false }
mod-estoque = { path = "../mod-estoque", default-features = false }
mod-clientes = { path = "../mod-clientes", default-features = false }
cardeal-ui = { workspace = true, optional = true }
egui       = { workspace = true, optional = true }
serde.workspace     = true
thiserror.workspace = true
smallvec.workspace  = true
rusqlite = { workspace = true, optional = true }
tracing.workspace   = true

[dev-dependencies]
cardeal-testkit.workspace = true
proptest.workspace        = true
cardeal-auth.workspace    = true
postcard.workspace        = true
tempfile.workspace        = true
