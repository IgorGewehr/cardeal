[package]
name         = "mod-financeiro"
description  = "Caixa, contas a pagar e a receber, bancos, conciliação e projeção de fluxo."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
default = ["sqlite"]
# Persistência em SQLite (despacho, repositório, migrações). Desligada, sobra o domínio
# e os tipos de comando/consulta — o que o cliente egui/WASM compila (ADR-0016).
sqlite = ["dep:cardeal-storage", "dep:rusqlite", "cardeal-ledger/sqlite", "cardeal-modkit/sqlite"]
# Telas do módulo (compiladas apenas no desktop).
ui = ["dep:cardeal-ui", "dep:egui"]
# Submódulos — ver docs/04-pilar-modularidade.md §2.1
caixa = []
receber = []
pagar = []
bancos = []
conciliacao = []
projecao = []
centro_custo = []
cobranca = []
cheques = []
dre = []
completo = ["caixa", "receber", "pagar", "bancos", "conciliacao", "projecao", "centro_custo", "cobranca", "cheques", "dre"]

[dependencies]
cardeal-kernel.workspace  = true
cardeal-ledger = { path = "../../cardeal-ledger", default-features = false }
cardeal-storage = { workspace = true, optional = true }
cardeal-modkit = { path = "../../cardeal-modkit", default-features = false }
cardeal-ui = { workspace = true, optional = true }
egui       = { workspace = true, optional = true }
serde.workspace     = true
rusqlite = { workspace = true, optional = true }
thiserror.workspace = true
smallvec.workspace  = true
tracing.workspace   = true

[dev-dependencies]
proptest.workspace = true
cardeal-auth.workspace = true
postcard.workspace = true
tempfile.workspace = true
