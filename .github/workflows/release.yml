# Publica uma release do GitHub a cada tag `v*.*.*` — com o binário Linux puro
# (`cardeal-desktop-linux-x86_64`, o asset que `cardeal_cliente::atualizador` procura, ver
# `docs/build/atualizacao.md`) e o `.rpm` (`docs/build/empacotamento.md`).
#
# Rodar `cargo xtask empacotar-linux` exige `rpmbuild` — não vem no runner `ubuntu-latest`
# por padrão, mas vem em qualquer imagem Fedora, então o job roda dentro de um container
# `fedora:latest` em vez de instalar rpm-build por fora.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Instala dependências de build (gcc, rpmbuild, git)
        run: dnf install -y gcc rpm-build git

      - uses: actions/checkout@v4

      - name: Instala o toolchain Rust estável
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo build --release (cardeal-desktop + cardeal-server)
        run: cargo build --release --bin cardeal-desktop --bin cardeal-server

      - name: Empacota o .rpm (cargo xtask empacotar-linux)
        run: cargo run -p xtask -- empacotar-linux --pular-build

      - name: Prepara o binário puro que o autoatualizador espera
        run: cp target/release/cardeal-desktop dist/cardeal-desktop-linux-x86_64

      - name: Publica a release com os artefatos
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/cardeal-desktop-linux-x86_64
          generate_release_notes: true
