# Verificações de todo push e pull request. O toolchain vem de `rust-toolchain.toml`
# (canal fixo + rustfmt + clippy): o rustup o instala na primeira chamada do cargo.
#
# `cargo xtask verificar-ui` impõe o ADR-0015 (telas só compõem `cardeal-ui`, nunca `egui` cru):
# é uma catraca — violação nova falha, e a dívida antiga só pode descer
# (`xtask/ui-baseline.toml`).
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Formatação (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lints (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: UI só compõe o design system (ADR-0015)
        run: cargo run -p xtask -- verificar-ui

      - name: Domínio compila para o navegador sem SQLite (ADR-0016)
        run: cargo run -p xtask -- verificar-wasm

      - name: Testes do workspace
        run: cargo test --workspace

  # O cliente do navegador (ADR-0016): compila, gera a ponte JS e pré-comprime — o mesmo
  # caminho da imagem Docker. A versão da CLI do wasm-bindgen sai do Cargo.lock.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Ferramentas do build web
        run: |
          versao=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo binstall -y --locked "wasm-bindgen-cli@${versao}" wasm-opt

      - name: Cliente web (cargo xtask construir-web)
        run: cargo run -p xtask -- construir-web
