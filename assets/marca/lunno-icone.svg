<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fundo: quadrado arredondado na cor da marca (Lua 500). -->
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#5B45E0"/>
  <!-- Lua crescente: o disco claro menos um disco deslocado para cima e à direita. -->
  <mask id="crescente">
    <rect x="0" y="0" width="200" height="200" fill="#000"/>
    <circle cx="96" cy="104" r="58" fill="#FFF"/>
    <circle cx="124" cy="80" r="50" fill="#000"/>
  </mask>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF" mask="url(#crescente)"/>
  <!-- Estrela pequena de quatro pontas, no vão da lua. -->
  <path d="M 138 66 L 142.5 77.5 L 154 82 L 142.5 86.5 L 138 98 L 133.5 86.5 L 122 82 L 133.5 77.5 Z" fill="#FFFFFF"/>
</svg>
