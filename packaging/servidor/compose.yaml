# O Cardeal online numa VPS: servidor + Cloudflare Tunnel. Nenhuma porta é aberta na VPS — o
# túnel sai de dentro para a Cloudflare, que entrega HTTPS, WAF e DDoS na frente.
#
#   CLOUDFLARE_TUNNEL_TOKEN=... docker compose -f packaging/servidor/compose.yaml up -d
#   docker compose -f packaging/servidor/compose.yaml run --rm cardeal \
#       provisionar --empresa "Loja" --cnpj 11222333000181 --email dono@loja.com --nome "Dono"
#   (senha em CARDEAL_SENHA)

services:
  cardeal:
    build:
      context: ../..
      dockerfile: packaging/servidor/Dockerfile
    # Construída localmente (`--build`) ou baixada pronta da CI:
    # CARDEAL_IMAGEM=ghcr.io/<dono>/cardeal-server:<versão> docker compose ... up -d
    image: ${CARDEAL_IMAGEM:-cardeal-server}
    restart: unless-stopped
    volumes:
      - dados:/dados
    environment:
      CARDEAL_OCIOSIDADE_MIN: "10"
      CARDEAL_TETO_EMPRESAS: "256"
      CARDEAL_BACKUP_MIN: "60"
      CARDEAL_BACKUP_RETER: "48"
      # Seguro só porque nenhuma porta é publicada: o único caminho até aqui é o túnel.
      CARDEAL_CONFIAR_CLOUDFLARE: "true"
      CARDEAL_SENHA: ${CARDEAL_SENHA:-}
    # Teto duro de memória: 256 empresas abertas ao mesmo tempo cabem com folga (~0,8 MB cada).
    mem_limit: 512m
    read_only: true
    # SIGTERM → o servidor termina as requisições em curso e fecha cada base limpa.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # Leva ao Cloudflare R2, **cifrado no cliente** (remote `crypt` do rclone):
  # - a réplica contínua do WAL (`/dados/replica`) a cada 10 s — só segmentos que pararam de
  #   crescer há 5 s: perda máxima fora da máquina ≈ 15 s;
  # - os snapshots horários (`/dados/backup`) a cada hora, como segunda camada.
  # `copy`, nunca `sync`: um disco local corrompido não apaga a cópia remota. A limpeza do que
  # é velho no R2 fica com uma regra de ciclo de vida do bucket (ex.: 30 dias).
  # Sem as variáveis R2_*, o serviço fica parado — réplica e snapshots locais continuam.
  backup-r2:
    image: rclone/rclone:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -z "$$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] && { echo "R2 não configurado"; exec sleep infinity; }
        n=0
        while true; do
          rclone copy /dados/replica cifrado:replica --min-age 5s --transfers 8 -q \
            || echo "falha ao enviar a réplica"
          if [ $$((n % 360)) -eq 0 ]; then
            rclone copy /dados/backup cifrado:backup --transfers 4 --exclude "ultima-assinatura" -q \
              && echo "snapshots enviados ao R2"
          fi
          n=$$((n + 1))
          sleep 10
        done
    volumes:
      - dados:/dados:ro
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_CIFRADO_TYPE: crypt
      RCLONE_CONFIG_CIFRADO_REMOTE: r2:${R2_BUCKET:-cardeal-backup}
      # Senha do crypt já "obscurecida" (`rclone obscure <senha>`) — guarde a original fora
      # da VPS: sem ela, o backup não volta.
      RCLONE_CONFIG_CIFRADO_PASSWORD: ${R2_CRIPTO_SENHA:-}

  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?defina o token do túnel}
    # Só abre o túnel com o servidor respondendo (HEALTHCHECK da imagem).
    depends_on:
      cardeal:
        condition: service_healthy

volumes:
  dados:
